services:
  - type: web
    name: kisaanlink-marketplace
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: AGRI_SECRET_KEY
        generateValue: true
      - key: APP_DATA_DIR
        value: /var/data